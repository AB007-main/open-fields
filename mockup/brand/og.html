<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#0E1311;color:#F2F5F0;
       font-family:Inter,sans-serif;position:relative;display:flex;flex-direction:column;
       justify-content:center;padding:72px 80px}
  .mow{position:absolute;inset:0;background:repeating-linear-gradient(102deg,
       rgba(53,208,127,.055) 0 84px, transparent 84px 168px)}
  .mow::after{content:"";position:absolute;inset:0;
       background:radial-gradient(120% 100% at 30% 0%, transparent 25%, #0E1311 90%)}
  .in{position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:16px;margin-bottom:44px}
  .brand svg{width:52px;height:52px;color:#35D07F}
  .name{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:42px;
        text-transform:uppercase;letter-spacing:.02em;line-height:1}
  .name em{font-style:normal;color:#35D07F}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:112px;
     text-transform:uppercase;line-height:.9;letter-spacing:.005em}
  h1 em{font-style:normal;color:#35D07F}
  p{color:#8A968F;font-size:26px;margin-top:26px;max-width:22ch;line-height:1.4}
  .row{display:flex;gap:12px;margin-top:44px}
  .badge{display:inline-flex;align-items:center;gap:9px;padding:9px 16px;border-radius:100px;
         font-family:"IBM Plex Mono",monospace;font-size:15px;letter-spacing:.08em;
         text-transform:uppercase}
  .badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
  .up{color:#35D07F;background:rgba(53,208,127,.14)}
  .sea{color:#F2A63B;background:rgba(242,166,59,.14)}
  .unv{color:#8A968F;background:rgba(138,150,143,.12)}
</style></head><body>
<div class="mow"></div>
<div class="in">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8.5 7.4v11M15.5 7.4v11M4.8 11.4h14.4M4.8 15.2h14.4" stroke-width=".95" opacity=".65"/>
      <path d="M4.4 18.6V7.4h15.2v11.2" stroke-width="2"/>
      <path d="M2.2 18.6h19.6" stroke-width="1.3" opacity=".4"/>
    </svg>
    <div class="name">Open<em>Fields</em></div>
  </div>
  <h1>Find a goal.<br><em>Go shoot.</em></h1>
  <p>Public fields with real goals, checked by the people who play there.</p>
  <div class="row">
    <span class="badge up">Goals up</span>
    <span class="badge sea">Seasonal</span>
    <span class="badge unv">Unverified</span>
  </div>
</div>
</body></html>
